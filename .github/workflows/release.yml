name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip

          # Add your project's Python dependencies here if required.
          # python -m pip install -r requirements.txt

      - name: Generate version.py
        run: |
          python3 scripts/var_setup.py

      - name: Build Linux runtime
        run: |
          python3 scripts/release/linux/release.py

      - name: Create Debian package
        run: |
          python3 scripts/packaging/linux/create_deb.py

      - name: Locate Debian package
        id: package
        shell: bash
        run: |
          PACKAGE_PATH="$(
            find release/linux \
              -maxdepth 1 \
              -type f \
              -name 'openterm_*.deb' \
              -printf '%T@ %p\n' |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-
          )"

          if [[ -z "$PACKAGE_PATH" || ! -f "$PACKAGE_PATH" ]]; then
            echo "Could not locate generated Debian package" >&2
            exit 1
          fi

          echo "path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate Debian package
        run: |
          dpkg-deb --info "${{ steps.package.outputs.path }}"
          dpkg-deb --contents "${{ steps.package.outputs.path }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.path }}
