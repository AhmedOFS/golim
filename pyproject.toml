[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "golim"
dynamic = ["version"]
description = "Terminal interface for LLMs (Ollama, OpenRouter, and OpenAI-compatible servers)"
license = { file = "LICENSE" }
requires-python = "==3.14.0"
dependencies = [
    "requests==2.32.5",
    "rich==15.0.0",
    "textual==8.2.8",
]

[project.scripts]
golim = "golim.__main__:main"

[tool.setuptools.packages.find]
include = ["golim*"]

[tool.setuptools_scm]
version_file = "golim/_version.py"
fallback_version = "0.0.0+unknown"
