[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "openterm"
dynamic = ["version"]
description = "Terminal interface for LLMs (Ollama, OpenRouter, and OpenAI-compatible servers)"
requires-python = "==3.14.0"
dependencies = [
    "requests==2.32.5",
    "rich==15.0.0",
    "textual==8.2.8",
]

[project.scripts]
openterm = "openterm.__main__:main"

[tool.setuptools.packages.find]
include = ["openterm*"]

[tool.setuptools_scm]
version_file = "openterm/_version.py"
fallback_version = "0.0.0+unknown"
