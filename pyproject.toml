[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openterm"
dynamic = ["version"]
description = "Terminal interface for LLMs (Ollama, OpenRouter, and OpenAI-compatible servers)"
requires-python = "==3.14.0"
dependencies = [
    "requests==2.32.5",
    "rich==15.0.0",
    "textual==8.2.8",
]

[project.scripts]
openterm = "openterm.__main__:main"

[tool.setuptools.packages.find]
include = ["openterm*"]

[tool.setuptools.dynamic]
version = {attr = "openterm.version.__version__"}
